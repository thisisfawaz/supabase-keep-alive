name: Keep Supabase Projects Active

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Keep Workbox active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_WORKBOX }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_WORKBOX_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_WORKBOX_KEY }}")

          echo "Workbox response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Workbox request failed."
            exit 1
          fi

      - name: Keep SkipLine active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_SKIPLINE }}/rest/v1/leads?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SKIPLINE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SKIPLINE_KEY }}")

          echo "SkipLine response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "SkipLine request failed."
            exit 1
          fi

      - name: Keep Banner active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_BANNER }}/rest/v1/campaigns?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_BANNER_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_BANNER_KEY }}")

          echo "Banner response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Banner request failed."
            exit 1
          fi

      - name: Keep This Is Fawaz active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_THISISFAWAZPROJECT }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_THISISFAWAZPROJECT_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_THISISFAWAZPROJECT_KEY }}")

          echo "This Is Fawaz response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "This Is Fawaz request failed."
            exit 1
          fi

      - name: Keep Bible Studier active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_BIBLESTUDIER}}/rest/v1/devotions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_BIBLESTUDIER_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_BIBLESTUDIER_KEY }}")

          echo "Bible Studier response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Bible Studier request failed."
            exit 1
          fi
          
      - name: Keep Shipfolio active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_SHIPFOLIO}}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SHIPFOLIO_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SHIPFOLIO_KEY }}")

          echo "Shipfolio response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Shipfolio request failed."
            exit 1
          fi
          
      - name: Keep Positioned active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_POSITIONED}}/rest/v1/Admin?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_POSITIONED_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_POSITIONED_KEY }}")

          echo "Positioned response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Positioned request failed."
            exit 1
          fi

      - name: Keep Timer active
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_TIMER}}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_TIMER_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_TIMER_KEY }}")

          echo "Positioned response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Timer request failed."
            exit 1
          fi

      - name: All projects checked
        run: echo "All 8 Supabase projects were successfully checked."
